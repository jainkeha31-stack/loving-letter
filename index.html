<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LovingLetter.com</title><style>body{margin:0;font-family:Segoe UI,sans-serif;background:linear-gradient(135deg,#ffd6e5,#f7e7a9,#dceeff);min-height:100vh} .container{max-width:1000px;margin:auto;padding:30px}.hero{text-align:center;padding:40px}.card{background:white;border-radius:20px;padding:20px;margin:20px 0;box-shadow:0 4px 12px rgba(0,0,0,.1)} input,textarea,select{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:1px solid #ddd}.stickers{font-size:35px;display:flex;flex-wrap:wrap;gap:10px}.letter{padding:20px;border-radius:15px;margin-top:20px}.btn{background:#ff6fa5;color:white;border:none;padding:12px 20px;border-radius:12px;cursor:pointer}</style></head><body><div class="container"><div class="hero"><h1>💌 LovingLetter.com</h1><p>Write what your heart wants to say.</p></div><div class="card"><h2>Recipient Name</h2><input id="name" placeholder="Enter your loved one's name"></div><div class="card"><h2>Choose Letter Theme</h2><select id="theme"><option value="#F7E7A9">Butter Yellow</option><option value="#DCEEFF">Baby Blue</option><option value="#FFD6E5">Blush Pink</option><option value="#E7D8FF">Lavender</option><option value="#B08968">Vintage Brown</option><option value="#FFFFFF">Classic White</option></select></div><div class="card"><h2>Cute Stickers</h2><div class="stickers">🧸 🎀 🌸 💕 ⭐ 🦋 🌙 ☁️ 💌 ☕ 📖 🐻</div></div><div class="card"><h2>Your Letter</h2><textarea id="msg" rows="8" placeholder="Tell them everything you feel..."></textarea><br><br><button class="btn" onclick="generateLetter()">Create Letter</button><div id="output"></div></div></div><script>function generateLetter(){let n=document.getElementById('name').value||'My Favorite Person';let m=document.getElementById('msg').value;let c=document.getElementById('theme').value;document.getElementById('output').innerHTML=`<div class='letter' style='background:${c}'><h2>Dear ${n},</h2><p>${m}</p><p><b>With Love ❤️</b></p></div>`;}</script></body></html>
